<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>facehub · Telegram</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../mini/style.css?v=20260928-7">
<script id="facehubMiniSdk" src="https://telegram.org/js/telegram-web-app.js?63" async></script>
<script>window.FACEHUB_MINI={platform:"telegram",label:"Telegram",api:"telegram_api.php",sdk:"https://telegram.org/js/telegram-web-app.js?63",hashKey:"tgWebAppData"};</script>
<script src="../mini/app.js?v=20260928-8" defer></script>
</head>
<body>
<div class="mini-shell">
<section class="mini-screen active" id="loadingScreen">
  <div class="loading-mark">f</div><strong>facehub</strong><span id="loadingStatus">Подключаю аккаунт…</span>
</section>

<section class="mini-screen" id="bindingScreen">
  <div class="binding-card">
    <div class="mini-brand"><span class="brand-mark">f</span><b>facehub</b></div>
    <div class="eyebrow">Первая синхронизация</div>
    <h1>Привязать Telegram</h1>
    <p id="bindingText">Свяжите Telegram с существующим аккаунтом facehub.</p>
    <form id="loginForm">
      <label><span>Email</span><input id="email" type="email" autocomplete="email" required></label>
      <label><span>Пароль</span><input id="password" type="password" autocomplete="current-password" required></label>
      <button id="loginButton" type="submit">Привязать аккаунт</button>
    </form>
    <button class="soft-action hidden" id="currentSessionButton" type="button">Использовать текущую сессию</button>
    <div class="mini-error" id="bindingError"></div>
    <div class="compat-note" id="compatNote"></div>
  </div>
</section>

<section class="mini-screen" id="homeScreen">
  <header class="app-head">
    <button class="head-back hidden" id="headBack" type="button" aria-label="Назад">‹</button>
    <div class="app-title"><strong id="viewTitle">facehub</strong><span id="viewSubtitle">Telegram mini app</span></div>
    <button class="avatar-button" id="profileButton" type="button"><img id="userAvatar" alt=""><span id="userInitial"></span></button>
  </header>
  <main id="viewRoot" class="view-root"></main>
  <nav class="bottom-nav" id="bottomNav">
    <button class="active" type="button" data-view="home"><i>⌂</i><span>Главная</span></button>
    <button type="button" data-view="books"><i>▤</i><span>Книги</span></button>
    <button type="button" data-view="music"><i>♪</i><span>Музыка</span></button>
    <button type="button" data-view="blog"><i>◫</i><span>Блог</span></button>
    <button type="button" data-view="poetry"><i>✦</i><span>Стихи</span></button>
  </nav>
</section>
</div>

<div class="sheet" id="readerSheet" aria-hidden="true"><div class="sheet-panel"><div class="sheet-handle"></div><div class="sheet-head"><h2 id="readerSheetTitle">Просмотр</h2><button class="sheet-close" type="button" data-close-sheet="readerSheet">×</button></div><div id="readerSheetBody"></div></div></div>

<div class="sheet" id="blogComposeSheet" aria-hidden="true"><div class="sheet-panel"><div class="sheet-handle"></div><div class="sheet-head"><h2>Новая публикация</h2><button class="sheet-close" type="button" data-close-sheet="blogComposeSheet">×</button></div>
<form id="miniBlogForm">
<label class="field"><span>Заголовок</span><input id="miniBlogTitle" required maxlength="180"></label>
<label class="field"><span>Текст</span><textarea id="miniBlogText" required placeholder="Текст публикации"></textarea></label>
<div class="mobile-media-picks">
  <label class="media-pick"><input id="miniBlogCamera" type="file" accept="image/*,video/*" capture="environment" hidden><b>Камера</b><span>снять фото или видео</span></label>
  <label class="media-pick"><input id="miniBlogGallery" type="file" accept="image/*,video/*" hidden><b>Галерея</b><span>выбрать на устройстве</span></label>
</div>
<div class="selected-media hidden" id="miniBlogMedia"><span id="miniBlogMediaName"></span><button type="button" id="miniBlogMediaClear">×</button></div>
<label class="field"><span>Статус</span><select id="miniBlogStatus"><option value="published">Опубликовать</option><option value="draft">Черновик</option></select></label>
<button class="primary-action" id="miniBlogSave" type="submit">Сохранить публикацию</button>
</form></div></div>

<div class="sheet" id="poemComposeSheet" aria-hidden="true"><div class="sheet-panel"><div class="sheet-handle"></div><div class="sheet-head"><h2>Новый стих</h2><button class="sheet-close" type="button" data-close-sheet="poemComposeSheet">×</button></div>
<form id="miniPoemForm">
<label class="field"><span>Название</span><input id="miniPoemTitle" maxlength="180"></label>
<div class="field-row"><label class="field"><span>Год</span><input id="miniPoemYear" type="number" min="1900" max="2200" required></label><label class="field"><span>Месяц</span><input id="miniPoemMonth" type="number" min="1" max="12"></label><label class="field"><span>День</span><input id="miniPoemDay" type="number" min="1" max="31"></label></div>
<label class="field"><span>Текст</span><textarea id="miniPoemText" required></textarea></label>
<button class="primary-action" id="miniPoemSave" type="submit">Добавить стих</button>
</form></div></div>

<div class="toast" id="miniToast"></div>
<audio id="miniAudio" preload="metadata"></audio>
</body>
</html>
